name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          gleam-version: "1.17.0"
          otp-version: "27"

      - name: Format check
        run: gleam format --check src test

      - name: Download dependencies
        run: gleam deps download

      - name: Run tests
        run: gleam test

# gleamunison is resolved as a git dep pinned to a public moneyacademyKE/gleamunison
# commit (see gleam.toml + manifest.toml), so "Download dependencies" resolves
# cleanly on a fresh runner — no local path, no auth needed (repo is public).
