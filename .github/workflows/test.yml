name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          gleam-version: "1.19.2"
          otp-version: "27"

      - name: Verify vendored dependency provenance
        run: sh scripts/vendor-aarondb.sh check

      - name: Format check
        run: gleam format --check src test

      - name: Download dependencies
        run: gleam deps download

      - name: Run tests
        run: gleam test

# gleamunison is locked through Hex; AaronDB is a verified in-tree dependency.
