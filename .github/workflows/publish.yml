name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and verify
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: binary-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      BANKAI_EMBED_BACKEND: term-hash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}

      - uses: erlef/setup-beam@v1
        with:
          gleam-version: "1.19.2"
          otp-version: "27"

      - name: Download dependencies
        run: gleam deps download

      - name: Run verification tests
        run: make test

      - name: Build and smoke-test escript
        run: |
          make escript
          chmod +x dist/bankai
          expected="${RELEASE_TAG#v}"
          ./dist/bankai --version | jq -e --arg version "$expected" '.ok.version == $version'

      - name: Upload missing asset and verify published download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json assets > release-assets.json
          asset_id=$(jq -r '.assets[] | select(.name == "bankai") | .id' release-assets.json)
          if [ -n "$asset_id" ]; then
            # Keep a recoverable copy before replacing a previously uploaded binary.
            mkdir -p previous
            gh release download "$RELEASE_TAG" --pattern bankai --dir previous
            mv previous/bankai "previous/bankai-before-${GITHUB_RUN_ID}"
            gh release upload "$RELEASE_TAG" "previous/bankai-before-${GITHUB_RUN_ID}"
          fi
          gh release upload "$RELEASE_TAG" dist/bankai --clobber
          mkdir -p downloaded
          gh release download "$RELEASE_TAG" --pattern bankai --dir downloaded
          chmod +x downloaded/bankai
          expected="${RELEASE_TAG#v}"
          ./downloaded/bankai --version | jq -e --arg version "$expected" '.ok.version == $version'
          ./downloaded/bankai --help > /dev/null
          sha256sum downloaded/bankai
