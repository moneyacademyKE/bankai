name = "bankai"
version = "0.1.0"
description = "Content-addressed task-memory graph for distributed AI agent swarms (Gleam OTP + gleamunison)"
licences = ["Apache-2.0"]
target = "erlang"

# bankai's genuine content-addressing layer. Not on Hex (v3.9.0 is author-local),
# so resolved as a path dependency to the working clone.
[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
simplifile = ">= 2.4.0 and < 3.0.0"
gleam_crypto = ">= 1.5.1 and < 2.0.0"
gleamunison = { path = "/Users/moe/Desktop/gleamunison_dogfood/gleamunison_repo" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
